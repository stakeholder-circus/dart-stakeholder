name: ci-native

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - shell: bash
        run: dart pub get
      - shell: bash
        run: python3 scripts/validate_scaffold.py
      - shell: bash
        run: dart format --set-exit-if-changed .
      - shell: bash
        run: dart analyze
      - shell: bash
        run: dart test
      - shell: bash
        run: mkdir -p build && dart compile exe bin/stakeholder.dart -o build/stakeholder
